<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>简历编排工具</title>
<style>
  :root {
    --ink: #1f2329;
    --muted: #6b7280;
    --line: #e5e6eb;
    --accent: #2563eb;
    --panel: #ffffff;
    --bg: #f4f5f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  /* 顶部工具条 */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 12px 24px;
    background: #fff; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .brand span { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  button {
    font-family: inherit; font-size: 13px; padding: 7px 14px;
    border-radius: 6px; border: 1px solid var(--line); background: #fff;
    color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: #c9cdd4; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }

  /* 主体两栏 */
  .layout {
    display: grid; grid-template-columns: 420px 1fr;
    gap: 20px; padding: 20px 24px 60px; align-items: start;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px;
  }
  .panel + .panel { margin-top: 16px; }
  .panel h2 {
    font-size: 13px; margin: 0 0 10px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel h2 em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], textarea, select {
    width: 100%; font-family: inherit; font-size: 13px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    background: #fff;
  }
  textarea { resize: vertical; line-height: 1.6; }
  input:focus, textarea:focus { outline: 2px solid #dbeafe; border-color: var(--accent); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .roles { display: flex; flex-wrap: wrap; gap: 6px; }
  .role {
    font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: #4e5969;
  }
  .role:hover { border-color: #c9cdd4; }
  .role.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: #eef2ff; color: #3730a3; border: 1px solid #e0e7ff;
  }
  .chip.hit { background: #dcfce7; color: #166534; border-color: #bbf7d0; }

  /* 项目推荐列表 */
  .proj {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .proj:hover { border-color: #c9cdd4; }
  .proj.on { border-color: var(--accent); background: #f8faff; }
  .proj-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .proj-name { font-size: 13px; font-weight: 600; }
  .score { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .score b { color: var(--accent); font-size: 13px; }
  .proj-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .proj-why { font-size: 11px; color: #166534; margin-top: 4px; line-height: 1.6; }

  /* 简历预览：A4 */
  .preview-wrap { position: sticky; top: 78px; }
  .paper {
    width: 794px; min-height: 1123px; margin: 0 auto;
    background: #fff; padding: 42px 48px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #1a1a1a; font-size: 10.5pt; line-height: 1.55;
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
  .head-main { flex: 1; min-width: 0; }
  .head-photo {
    width: 84px; height: 108px; flex: none; border-radius: 4px;
    border: 1px dashed #c9cdd4; display: grid; place-items: center;
    cursor: pointer; overflow: hidden; position: relative;
    font-size: 9pt; color: #9aa0a6; text-align: center; line-height: 1.4;
    background: #fafafa;
  }
  .head-photo:hover { border-color: #2563eb; color: #2563eb; }
  .head-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-del {
    position: absolute; top: 1px; right: 1px; width: 16px; height: 16px;
    padding: 0; font-size: 12px; line-height: 14px; border-radius: 3px;
    border: none; background: rgba(0,0,0,.45); color: #fff; cursor: pointer;
  }
  .paper h1 { font-size: 22pt; margin: 0 0 2px; letter-spacing: 2px; }
  .contact { font-size: 9pt; color: #444; }
  .contact span { margin-right: 12px; }
  .intent { font-size: 10pt; margin-top: 6px; }
  .intent b { font-weight: 600; }
  .sec { margin-top: 12px; }
  .sec-title {
    font-size: 11.5pt; font-weight: 700; letter-spacing: 1px;
    border-bottom: 1px solid #333; padding-bottom: 2px; margin-bottom: 6px;
  }
  .edu-line { display: flex; justify-content: space-between; }
  .muted { color: #444; }
  .proj-item { margin-bottom: 8px; }
  .proj-title { display: flex; justify-content: space-between; font-weight: 700; font-size: 10.5pt; }
  .proj-title .role { font-weight: 400; color: #444; font-size: 10pt; }
  .proj-desc { font-size: 9.5pt; color: #333; margin: 2px 0 3px; }
  .proj-url { font-size: 9pt; color: #555; }
  .paper a { color: #1a4fb4; text-decoration: none; }
  ul { margin: 3px 0 0; padding-left: 16px; }
  li { font-size: 9.8pt; margin-bottom: 2px; line-height: 1.5; }
  li b { font-weight: 600; }

  .hint { font-size: 11px; color: var(--muted); line-height: 1.7; }
  .hidden { display: none !important; }

  /* 打印：只留 A4 */
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .topbar, .layout > .left, .preview-wrap > .panel-hint { display: none !important; }
    .layout { display: block; padding: 0; }
    .preview-wrap { position: static; }
    .paper { box-shadow: none; width: 210mm; min-height: 297mm; margin: 0; padding: 14mm 16mm; }
    .head-photo { border: none; background: transparent; }
    .photo-del { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>简历编排工具</h1>
    <span id="statusText">粘贴 JD 后自动推荐项目</span>
  </div>
  <div class="actions">
    <button id="btnSample">填入示例 JD</button>
    <button id="btnWord">导出 Word</button>
    <button id="btnPdf" class="primary">导出 PDF</button>
  </div>
</div>

<div class="layout">
  <!-- 左栏：输入与选择 -->
  <div class="left">
    <div class="panel">
      <h2>岗位预设 <em>点击套用</em></h2>
      <div class="roles" id="roleList"></div>
      <div class="hint" style="margin-top:8px">套用后会切换项目组合、求职意向与技能排序，之后再贴 JD 做微调。</div>
    </div>

    <div class="panel">
      <h2>目标岗位 JD <em>粘贴后自动分析</em></h2>
      <textarea id="jd" rows="9" placeholder="把招聘要求整段粘进来，例如：&#10;1. 熟悉 Java 基础，掌握 Spring Boot、MyBatis；&#10;2. 熟悉 MySQL、Redis，了解消息队列；&#10;3. 有 AI Agent、RAG 相关经验优先"></textarea>
      <div class="chips" id="jdChips"></div>
    </div>

    <div class="panel">
      <h2>项目推荐 <em id="pickCount">已选 0 个</em></h2>
      <div id="projList"></div>
      <div class="hint" style="margin-top:10px">
        点选项目加入简历，点击顺序即简历中的顺序。建议只放 2–3 个。
      </div>
    </div>

    <div class="panel">
      <h2>基本信息</h2>
      <div class="row2">
        <div><label>姓名</label><input type="text" id="fName" placeholder="你的姓名"></div>
        <div><label>出生年月</label><input type="text" id="fBirth" placeholder="2000/01"></div>
      </div>
      <div class="row2">
        <div><label>手机</label><input type="text" id="fPhone" placeholder="13800000000"></div>
        <div><label>邮箱</label><input type="text" id="fMail" placeholder="you@example.com"></div>
      </div>
      <label>个人主页</label>
      <input type="text" id="fHome" placeholder="your-site.github.io">
      <label>求职意向</label>
      <input type="text" id="fIntent" placeholder="Java 后端开发">
    </div>
  </div>

  <!-- 右栏：预览 -->
  <div class="preview-wrap">
    <div class="panel-hint hint" style="text-align:center;margin-bottom:8px">
      下面是导出效果预览，A4 单页
    </div>
    <div class="paper" id="paper"></div>
  </div>
</div>

<script src="profile.js" onerror="void 0"></script>

/* 岗位方向词表：用于把 JD 归到某个方向，影响排序权重 */
const DIRECTIONS = {
  ai: ["ai", "agent", "大模型", "llm", "rag", "向量", "智能体", "mcp", "prompt", "推理"],
  backend: ["java", "spring", "后端", "服务端", "微服务", "mysql", "redis", "高并发", "中间件"],
  go: ["go", "golang", "云原生", "kubernetes", "k8s", "docker"],
  cpp: ["c++", "cpp", "linux", "底层", "网络编程", "内核", "嵌入式", "驱动"],
  test: ["测试", "自动化", "质量", "qa", "sdet", "用例", "接口测试"],
  frontend: ["vue", "react", "前端", "javascript", "typescript"]
};

/* ------------------------------------------------------------------
   匹配：JD 文本 → 关键词集合 → 项目打分
------------------------------------------------------------------ */
function analyzeJD(text) {
  const lower = (text || "").toLowerCase();
  const hits = [];
  for (const [dir, words] of Object.entries(DIRECTIONS)) {
    for (const w of words) {
      if (lower.includes(w)) hits.push({ dir, word: w });
    }
  }
  // 方向权重：出现次数越多，该方向越重要
  const dirScore = {};
  for (const h of hits) dirScore[h.dir] = (dirScore[h.dir] || 0) + 1;
  return { hits, dirScore };
}

function scoreProject(proj, analysis) {
  const lower = analysis.text;
  let hitCount = 0;
  const matched = [];
  for (const tag of proj.tags) {
    if (lower.includes(tag)) { hitCount++; matched.push(tag); }
  }
  // 方向契合度
  let dirBonus = 0;
  for (const d of proj.direction) {
    if (analysis.dirScore[d]) dirBonus += analysis.dirScore[d] * 2;
  }
  const score = hitCount * 3 + dirBonus;
  return { score, hitCount, matched, dirBonus };
}

/* ------------------------------------------------------------------

------------------------------------------------------------------ */
function renderProjects() {
  const list = document.getElementById("projList");
  list.innerHTML = "";
  const ranked = PROJECTS.map(p => {
    const s = scoreProject(p, state.analysis);
    return { p, ...s };
  }).sort((a, b) => b.score - a.score);

  for (const item of ranked) {
    const on = state.selected.includes(item.p.id);
    const div = document.createElement("div");
    div.className = "proj" + (on ? " on" : "");
    const why = item.matched.length
      ? "命中：" + item.matched.slice(0, 6).join("、")
      : "与 JD 关键词重合较少";
    div.innerHTML = `
      <div class="proj-head">
        <span class="proj-name">${on ? "✓ " : ""}${item.p.name}</span>
        <span class="score"><b>${item.score}</b> 分</span>
      </div>
      <div class="proj-meta">${item.p.stack} · ${item.p.direction.join(" / ")}</div>
      <div class="proj-why">${why}</div>`;
    div.onclick = () => toggle(item.p.id);
    list.appendChild(div);
  }
  document.getElementById("pickCount").textContent = `已选 ${state.selected.length} 个`;
}

function applyRole(roleId) {
  const role = ROLE_PRESETS.find(r => r.id === roleId);
  if (!role) return;
  state.roleId = roleId;
  state.selected = role.projects.filter(id => PROJECTS.some(p => p.id === id));
  state.skills = role.skills;
  document.getElementById("fIntent").value = role.intent;
  renderRoles();
  renderProjects();
  renderPaper();
}

function renderRoles() {
  const box = document.getElementById("roleList");
  box.innerHTML = "";
  for (const r of ROLE_PRESETS) {
    const d = document.createElement("div");
    d.className = "role" + (r.id === state.roleId ? " on" : "");
    d.textContent = r.label;
    d.onclick = () => applyRole(r.id);
    box.appendChild(d);
  }
}

function toggle(id) {
  const i = state.selected.indexOf(id);
  if (i >= 0) state.selected.splice(i, 1);
  else {
    if (state.selected.length >= 3) state.selected.shift();
    state.selected.push(id);
  }
  renderProjects();
  renderPaper();
}

/* ------------------------------------------------------------------
   导出 Word：用带 Word 命名空间的 HTML，Word 可直接打开并编辑
------------------------------------------------------------------ */
function exportWord() {
  // Word 不认 flex 布局，照片改成右浮动的 img，并去掉预览专用按钮
  let body = document.getElementById("paper").innerHTML;
  body = body.replace(/<button class="photo-del"[\s\S]*?<\/button>/g, "");
  if (state.photo) {
    body = body.replace(
      /<div class="head-photo"[^>]*>[\s\S]*?<\/div>/,
      `<img src="${state.photo}" style="float:right;width:84px;height:108px;object-fit:cover;margin-left:12px;">`);
  } else {
    body = body.replace(/<div class="head-photo"[^>]*>[\s\S]*?<\/div>/, "");
  }
  body = body.replace('<div class="head">', '<div>').replace('</div></div>', '</div>');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8">
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View>
  <w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
  <style>
    @page { size: A4; margin: 1.4cm 1.6cm; }
    body { font-family: "Microsoft YaHei"; font-size: 10.5pt; line-height: 1.5; color: #1a1a1a; }
    h1 { font-size: 22pt; margin: 0 0 4pt; letter-spacing: 2pt; }
    .contact { font-size: 9pt; color: #444; }
    .contact span { margin-right: 12pt; }
    .intent { font-size: 10pt; margin-top: 4pt; }
    .sec { margin-top: 10pt; }
    .sec-title { font-size: 11.5pt; font-weight: bold; border-bottom: 1px solid #333;
                 padding-bottom: 2pt; margin-bottom: 4pt; }
    .edu-line, .proj-title { display: block; }
    .proj-title { font-weight: bold; margin-top: 6pt; }
    .proj-item { margin-bottom: 6pt; }
    .proj-desc { font-size: 9.5pt; color: #333; }
    .proj-url { font-size: 9pt; color: #555; }
    a { color: #1a4fb4; text-decoration: none; }
    ul { margin: 2pt 0 0 0; padding-left: 14pt; }
    li { font-size: 9.8pt; margin-bottom: 2pt; }
    .muted { color: #444; }
  </style></head><body>${body}</body></html>`;

  const blob = new Blob(["\ufeff", html], { type: "application/msword" });
  download(blob, `简历-${readForm().intent || "通用"}.doc`);
}

function download(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function renderJdChips() {
  const box = document.getElementById("jdChips");
  const seen = new Set();
  box.innerHTML = "";
  // 只展示方向，避免几十个关键词堆在一起
  for (const [dir, n] of Object.entries(state.analysis.dirScore)) {
    if (n <= 0 || seen.has(dir)) continue;
    seen.add(dir);
    const label = { ai: "AI/Agent", backend: "后端", go: "Go/云原生",
                    cpp: "C++/底层", test: "测试", frontend: "前端" }[dir] || dir;
    const span = document.createElement("span");
    span.className = "chip hit";
    span.textContent = `${label} ×${n}`;
    box.appendChild(span);
  }
  if (!box.children.length) {
    const span = document.createElement("span");
    span.className = "chip";
    span.textContent = "尚未识别到方向关键词";
    box.appendChild(span);
  }
}

// JD 变化后若还没选项目，自动勾选分数最高的两个
function autoPickIfEmpty() {
  if (state.selected.length) return;
  const ranked = PROJECTS.map(p => ({ p, ...scoreProject(p, state.analysis) }))
                         .sort((a, b) => b.score - a.score)
                         .slice(0, 2)
                         .map(x => x.p.id);
  state.selected = ranked;
}

/* ------------------------------------------------------------------
   照片：选择后等比缩放到 300x400 以内再转 base64，
   避免大图撑爆 localStorage（上限约 5MB）
------------------------------------------------------------------ */
const photoInput = document.createElement("input");
photoInput.type = "file";
photoInput.accept = "image/*";
photoInput.style.display = "none";
document.body.appendChild(photoInput);

photoInput.addEventListener("change", () => {
  const file = photoInput.files && photoInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 300, maxH = 400;
      const scale = Math.min(maxW / img.width, maxH / img.height, 1);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      state.photo = canvas.toDataURL("image/jpeg", 0.86);
      try { localStorage.setItem("resume.photo", state.photo); } catch (e) {
        console.warn("照片过大，未能保存到本地缓存");
      }
      renderPaper();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = "";
});

// 照片区与移除按钮用事件委托，避免每次渲染后重新绑定
document.addEventListener("click", (e) => {
  if (e.target.closest("#photoDel")) {
    state.photo = null;
    localStorage.removeItem("resume.photo");
    renderPaper();
    return;
  }
  if (e.target.closest("#photoSlot")) {
    photoInput.click();
  }
});
