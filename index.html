<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>简历编排工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2322303C'/><rect x='8' y='10' width='16' height='3' rx='1.5' fill='%23F3EFE6'/><rect x='8' y='16' width='11' height='3' rx='1.5' fill='%23F3EFE6'/><rect x='8' y='22' width='7' height='3' rx='1.5' fill='%23F3EFE6'/></svg>">
<style>
  :root {
    --ink: #1f2329; --muted: #6b7280; --line: #e5e6eb;
    --accent: #2563eb; --panel: #fff; --bg: #f4f5f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); }

  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
            justify-content: space-between; gap: 16px; padding: 12px 24px;
            background: #fff; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .brand span { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  button { font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: 6px;
           border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  button:hover { border-color: #c9cdd4; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.mini { padding: 5px 10px; font-size: 12px; }

  .layout { display: grid; grid-template-columns: 400px 1fr; gap: 20px;
            padding: 20px 24px 60px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel + .panel { margin-top: 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 10px; font-weight: 600;
              display: flex; align-items: center; justify-content: space-between; }
  .panel h2 em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; font-family: inherit; font-size: 13px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: #fff; }
  textarea { resize: vertical; line-height: 1.6; }
  input:focus, textarea:focus { outline: 2px solid #dbeafe; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .roles { display: flex; flex-wrap: wrap; gap: 6px; }
  .role-btn { font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
              border: 1px solid var(--line); background: #fff; color: #4e5969; }
  .role-btn:hover { border-color: #c9cdd4; }
  .role-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 4px;
          background: #eef2ff; color: #3730a3; border: 1px solid #e0e7ff; }
  .chip.hit { background: #dcfce7; color: #166534; border-color: #bbf7d0; }

  .proj { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
          margin-bottom: 8px; cursor: pointer; }
  .proj:hover { border-color: #c9cdd4; }
  .proj.on { border-color: var(--accent); background: #f8faff; }
  .proj-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .proj-name { font-size: 13px; font-weight: 600; }
  .score { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .score b { color: var(--accent); font-size: 13px; }
  .proj-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .proj-why { font-size: 11px; color: #166534; margin-top: 4px; line-height: 1.6; }
  .proj-ai { font-size: 11px; color: #1d4ed8; margin-top: 4px; line-height: 1.6; }

  .preview-wrap { position: sticky; top: 78px; }
  .paper { width: 794px; min-height: 1123px; margin: 0 auto; background: #fff;
           padding: 34px 44px; box-shadow: 0 4px 18px rgba(0,0,0,.08);
           font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
           color: #1a1a1a; font-size: 10.5pt; line-height: 1.55; }

  .head { overflow: hidden; }
  .head-photo { float: right; width: 84px; height: 108px; margin-left: 14px;
                border: 1px dashed #c9cdd4; border-radius: 4px; display: grid;
                place-items: center; cursor: pointer; overflow: hidden; position: relative;
                font-size: 9pt; color: #9aa0a6; text-align: center; line-height: 1.4; background: #fafafa; }
  .head-photo:hover { border-color: var(--accent); color: var(--accent); }
  .head-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-del { position: absolute; top: 1px; right: 1px; width: 16px; height: 16px;
               padding: 0; font-size: 12px; line-height: 14px; border-radius: 3px;
               border: none; background: rgba(0,0,0,.45); color: #fff; cursor: pointer; }

  .paper h1 { font-size: 22pt; margin: 0 0 2px; letter-spacing: 2px; }
  .contact { font-size: 9pt; color: #444; }
  .contact span { margin-right: 12px; }
  .intent { font-size: 10pt; margin-top: 6px; }
  .sec { margin-top: 10px; }
  .sec-title { font-size: 11.5pt; font-weight: 700; letter-spacing: 1px;
               border-bottom: 1px solid #333; padding-bottom: 2px; margin-bottom: 6px; }
  .edu-line, .proj-title { overflow: hidden; }
  .edu-line .date, .proj-title .date { float: right; font-weight: 400; font-size: 10pt; color: #333; }
  .muted { color: #444; }
  .proj-item { margin-bottom: 6px; }
  .proj-title { font-weight: 700; font-size: 10.5pt; margin-top: 2px; }
  .proj-title .role { font-weight: 400; color: #555; font-size: 10pt; }
  .proj-desc { font-size: 9.5pt; color: #333; margin: 1px 0 2px; }
  .proj-url { font-size: 9pt; color: #555; }
  ul { margin: 3px 0 0; padding-left: 16px; }
  li { font-size: 9.8pt; margin-bottom: 1.5px; line-height: 1.45; }
  li b { font-weight: 600; }

  [contenteditable="true"] { outline: none; border-radius: 3px; }
  [contenteditable="true"]:hover { background: #f6f8ff; box-shadow: 0 0 0 1px #dbeafe inset; }
  [contenteditable="true"]:focus { background: #fff; box-shadow: 0 0 0 1px var(--accent) inset; }

  .hint { font-size: 11px; color: var(--muted); line-height: 1.7; }
  .warn { color: #b45309; }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .topbar, .layout > .left { display: none !important; }
    .layout { display: block; padding: 0; }
    .preview-wrap { position: static; }
    .paper { box-shadow: none; width: 210mm; min-height: 0; margin: 0; padding: 12mm 15mm; }
    .head-photo { border: none; background: transparent; }
    .head-photo.empty { display: none; }
    .photo-del { display: none; }
    [contenteditable="true"]:hover, [contenteditable="true"]:focus { background: transparent; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>简历编排工具</h1>
    <span id="statusText">左侧粘 JD，右侧直接编辑</span>
  </div>
  <div class="actions">
    <button id="btnSample" class="mini">示例 JD</button>
    <button id="btnAi" class="mini">AI 分析</button>
    <button id="btnWord">导出 Word</button>
    <button id="btnPdf" class="primary">导出 PDF</button>
  </div>
</div>

<div class="layout">
  <div class="left">
    <div class="panel">
      <h2>岗位预设 <em>点击套用</em></h2>
      <div class="roles" id="roleList"></div>
    </div>

    <div class="panel">
      <h2>目标岗位 JD <em>粘贴后自动分析</em></h2>
      <textarea id="jd" rows="8" placeholder="把招聘要求整段粘进来"></textarea>
      <div class="chips" id="jdChips"></div>
    </div>

    <div class="panel">
      <h2>项目推荐 <em id="pickCount">已选 0 个</em></h2>
      <div id="projList"></div>
      <div class="hint" style="margin-top:10px">
        点选项目加入简历，点击顺序即简历中的顺序。建议只放 2–3 个。
      </div>
    </div>

    <div class="panel">
      <h2>AI 分析 <em id="aiState">未配置</em></h2>
      <div class="hint">
        配置一个 OpenAI 兼容接口，可以让模型判断哪个项目更贴合 JD。
        不配置也能用，走关键词打分。
      </div>
      <label>接口地址</label>
      <input type="text" id="aiBase" placeholder="https://api.deepseek.com/v1">
      <div class="row2">
        <div><label>模型</label><input type="text" id="aiModel" placeholder="deepseek-chat"></div>
        <div><label>密钥</label><input type="password" id="aiKey" placeholder="sk-..."></div>
      </div>
      <div style="display:flex; gap:8px; margin-top:10px">
        <button class="mini" id="btnAiRun">用 AI 重新打分</button>
        <button class="mini" id="btnAiClear">清除配置</button>
      </div>
      <div class="hint" id="aiMsg" style="margin-top:8px"></div>
      <div class="hint warn" style="margin-top:8px">
        密钥只存在这台浏览器的 localStorage，不随页面或仓库上传。
        若接口不允许跨域，浏览器会拦截，此时仍可用关键词打分。
      </div>
    </div>
  </div>

  <div class="preview-wrap">
    <div class="hint" style="text-align:center;margin-bottom:8px">
      右侧内容可直接点击修改，改动自动保存在本地
    </div>
    <div class="paper" id="paper"></div>
  </div>
</div>

<script src="profile.js" onerror="void 0"></script>

/* ------------------------------------------------------------------
   匹配：关键词打分 + 项目稀缺度
------------------------------------------------------------------ */
function analyzeJD(text) {
  const lower = (text || "").toLowerCase();
  const dirScore = {};
  for (const [dir, words] of Object.entries(DIRECTIONS)) {
    for (const w of words) if (lower.includes(w)) dirScore[dir] = (dirScore[dir] || 0) + 1;
  }
  return { text: lower, dirScore };
}

function scoreProject(proj, analysis) {
  const lower = analysis.text || "";
  let hitCount = 0;
  const matched = [];
  for (const tag of proj.tags) if (lower.includes(tag)) { hitCount++; matched.push(tag); }
  let dirBonus = 0;
  for (const d of proj.direction) if (analysis.dirScore[d]) dirBonus += analysis.dirScore[d] * 2;
  const raw = (hitCount * 3 + dirBonus) * (proj.distinct || 1);
  return { score: Math.round(raw), hitCount, matched, dirBonus };
}

function inferIntent(text) {
  const t = (text || "").toLowerCase();
  const rules = [
    { keys: ["测试开发", "sdet", "自动化测试"], title: "测试开发工程师" },
    { keys: ["ai agent", "智能体", "大模型应用", "llm 应用", "rag"], title: "AI Agent 应用开发工程师" },
    { keys: ["c++", "cpp"], title: "C++ 后端 / 系统开发工程师" },
    { keys: ["go", "golang"], title: "Go 服务端开发工程师" },
    { keys: ["运维开发", "sre", "devops", "服务器"], title: "服务器开发 / 运维开发工程师" },
    { keys: ["前端", "vue", "react"], title: "前端开发工程师" }
  ];
  for (const r of rules) if (r.keys.some(k => t.includes(k))) return r.title;
  if (t.includes("java") || t.includes("后端")) return "Java 后端开发工程师";
  return PROFILE.intent;
}

/* ------------------------------------------------------------------
   技能汇总
------------------------------------------------------------------ */
function techBase(text) { return text.split(/[（(]/)[0].trim(); }
function techDetail(text) { const m = text.match(/[（(]([^）)]+)[）)]/); return m ? m[1].trim() : ""; }

function composeSkills(projectIds, order) {
  const jd = (state.jd || "").toLowerCase();
  const picked = projectIds.map(id => PROJECTS.find(p => p.id === id)).filter(p => p && p.skills);
  if (!picked.length) return [];

  const bucket = new Map();
  for (const proj of picked) {
    for (const [cat, text] of proj.skills) {
      if (!bucket.has(cat)) bucket.set(cat, new Map());
      const m = bucket.get(cat);
      const key = techBase(text);
      const old = m.get(key) || { detail: [] };
      const d = techDetail(text);
      if (d && !old.detail.includes(d)) old.detail.push(d);
      m.set(key, { name: key, detail: old.detail });
    }
  }

  const seq = order && order.length ? order : Object.keys(SKILL_LABEL);
  const lines = [];
  for (const cat of seq) {
    const items = bucket.get(cat);
    if (!items || !items.size) continue;
    const arr = [...items.values()];
    arr.sort((a, b) => {
      const hitA = jd && jd.includes(a.name.toLowerCase()) ? 0 : 1;
      const hitB = jd && jd.includes(b.name.toLowerCase()) ? 0 : 1;
      return hitA - hitB;
    });
    let joined = arr.map(it => it.detail.length ? `${it.name}（${it.detail.join("、")}）` : it.name).join("、");
    if (joined.length > 88) joined = joined.slice(0, 86) + "…";
    lines.push(`<b>${SKILL_LABEL[cat] || cat}</b>：${joined}`);
    if (lines.length >= 4) break;
  }
  return lines;
}

function renderProjects() {
  const list = document.getElementById("projList");
  list.innerHTML = "";
  const ranked = PROJECTS.map(p => {
    const s = scoreProject(p, state.analysis);
    const ai = state.aiScores && state.aiScores[p.id];
    const val = ai ? ai.score * 0.7 + s.score * 0.3 : s.score;
    return { p, ...s, ai, val };
  }).sort((a, b) => b.val - a.val);

  for (const item of ranked) {
    const on = state.selected.includes(item.p.id);
    const div = document.createElement("div");
    div.className = "proj" + (on ? " on" : "");
    const why = item.matched.length ? "命中：" + item.matched.slice(0, 6).join("、") : "与 JD 关键词重合较少";
    const aiLine = item.ai ? `<div class="proj-ai">AI：${item.ai.reason}</div>` : "";
    div.innerHTML = `
      <div class="proj-head">
        <span class="proj-name">${on ? "✓ " : ""}${item.p.name}</span>
        <span class="score"><b>${Math.round(item.ai ? item.ai.score : item.score)}</b> 分</span>
      </div>
      <div class="proj-meta">${item.p.stack} · 稀缺度 ${item.p.distinct}</div>
      <div class="proj-why">${why}</div>
      ${aiLine}`;
    div.onclick = () => toggle(item.p.id);
    list.appendChild(div);
  }
  document.getElementById("pickCount").textContent = `已选 ${state.selected.length} 个`;
}

function toggle(id) {
  state.touched = true;
  const i = state.selected.indexOf(id);
  if (i >= 0) state.selected.splice(i, 1);
  else {
    if (state.selected.length >= 3) state.selected.shift();
    state.selected.push(id);

  state.skills = composeSkills(state.selected, currentOrder());
  renderProjects(); renderPaper();
}

  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 300, maxH = 400;
      const scale = Math.min(maxW / img.width, maxH / img.height, 1);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      state.photo = canvas.toDataURL("image/jpeg", 0.86);
      try { localStorage.setItem("resume.photo", state.photo); } catch (err) {}
      renderPaper();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = "";
});

/* ------------------------------------------------------------------
   AI 分析
------------------------------------------------------------------ */
function aiReady() {
  const a = state.ai || {};
  return !!(a.base && a.key && a.model);
}

function updateAiState() {
  document.getElementById("aiState").textContent = aiReady() ? "已配置" : "未配置";
  document.getElementById("aiBase").value = state.ai.base || "";
  document.getElementById("aiModel").value = state.ai.model || "";
  document.getElementById("aiKey").value = state.ai.key || "";
}

async function runAi() {
  const msg = document.getElementById("aiMsg");
  if (!state.jd || state.jd.trim().length < 30) { msg.textContent = "先在左边粘一段 JD。"; return; }
  if (!aiReady()) { msg.textContent = "请先填写接口地址、模型和密钥。"; return; }

  msg.textContent = "分析中…";
  const list = PROJECTS.map(p => ({ id: p.id, name: p.name, stack: p.stack, desc: p.desc, distinct: p.distinct }));

  const sys = "你是技术招聘顾问。评估候选人项目与岗位 JD 的匹配度。"
    + "只有当项目技术栈与 JD 要求确实相关时才给高分；大众题（人人做过的管理系统）适当降分。"
    + "只返回 JSON：{\"results\":[{\"id\":\"项目id\",\"score\":0-100,\"reason\":\"不超过30字的中文理由\"}]}";
  const user = "岗位 JD：\n" + state.jd.slice(0, 3000) + "\n\n候选项目：\n" + JSON.stringify(list, null, 1);

  try {
    const url = state.ai.base.replace(/\/+$/, "") + "/chat/completions";
    const resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.ai.key },
      body: JSON.stringify({
        model: state.ai.model, temperature: 0.2,
        messages: [{ role: "system", content: sys }, { role: "user", content: user }]
      })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
    const jsonText = text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1);
    const parsed = JSON.parse(jsonText);

    const map = {};
    for (const r of parsed.results || []) if (r && r.id) map[r.id] = { score: Number(r.score) || 0, reason: r.reason || "" };
    if (!Object.keys(map).length) throw new Error("返回内容无法解析");
    state.aiScores = map;
    renderProjects();
    msg.textContent = "已按 AI 结果重排，点选项目即可加入。";
  } catch (e) {
    state.aiScores = null;
    renderProjects();
    msg.textContent = "调用失败：" + e.message + "。可能是密钥无效、模型名不对，或接口不允许跨域。当前仍按关键词打分。";
  }
}

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ------------------------------------------------------------------
   事件
------------------------------------------------------------------ */
const jdEl = document.getElementById("jd");
let jdTimer = null;

jdEl.addEventListener("input", () => {
  state.jd = jdEl.value;
  clearTimeout(jdTimer);
  jdTimer = setTimeout(() => {
    state.analysis = analyzeJD(state.jd);
    state.aiScores = null;
    renderJdChips();

    PROFILE.intent = inferIntent(state.jd);
    state.profile.intent = PROFILE.intent;

    if (!state.touched) autoPick(3);
    state.skills = composeSkills(state.selected, currentOrder());
    renderProjects(); renderPaper();
  }, 250);
});

function autoPick(n) {
  const ranked = PROJECTS.map(p => ({ p, ...scoreProject(p, state.analysis) }))
    .sort((a, b) => b.score - a.score).slice(0, n || 2).map(x => x.p.id);
  state.selected = ranked;
}

function renderJdChips() {
  const box = document.getElementById("jdChips");
  box.innerHTML = "";
  const labels = { ai: "AI/Agent", backend: "后端", go: "Go/云原生",
                   cpp: "C++/底层", test: "测试", frontend: "前端" };
  let any = false;
  for (const [dir, n] of Object.entries(state.analysis.dirScore || {})) {
    if (!n) continue;
    any = true;
    const s = document.createElement("span");
    s.className = "chip hit";
    s.textContent = `${labels[dir] || dir} ×${n}`;
    box.appendChild(s);
  }
  if (!any) {
    const s = document.createElement("span");
    s.className = "chip"; s.textContent = "尚未识别到方向关键词";
    box.appendChild(s);
  }
}
